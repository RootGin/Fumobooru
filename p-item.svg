<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="200" height="200">
  <defs>
    <linearGradient id="darkRedBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cc0000" />
      <stop offset="100%" stop-color="#550000" />
    </linearGradient>
    
    <linearGradient id="brightRedBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3333" />
      <stop offset="15%" stop-color="#dd0000" />
      <stop offset="85%" stop-color="#aa0000" />
      <stop offset="100%" stop-color="#550000" />
    </linearGradient>
    
    <linearGradient id="silverBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e0e0" />
      <stop offset="100%" stop-color="#aaaaaa" />
    </linearGradient>
    
    <linearGradient id="innerRedBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e60000" />
      <stop offset="100%" stop-color="#800000" />
    </linearGradient>
    
    <linearGradient id="textSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cccccc" />
    </linearGradient>

    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer dark edge -->
  <rect x="5" y="5" width="110" height="110" rx="20" fill="url(#darkRedBase)" filter="url(#drop-shadow)"/>
  
  <!-- Main red bezel -->
  <rect x="8" y="8" width="104" height="104" rx="17" fill="url(#brightRedBezel)" />
  
  <!-- Silver border -->
  <rect x="18" y="18" width="84" height="84" rx="12" fill="url(#silverBorder)" filter="url(#drop-shadow)"/>
  
  <!-- Inner red background -->
  <rect x="25" y="25" width="70" height="70" rx="8" fill="url(#innerRedBg)" stroke="#4a0000" stroke-width="1.5" />
  
  <!-- Inner top highlight for gloss -->
  <path d="M 26 33 Q 60 25 94 33 L 94 28 Q 60 23 26 28 Z" fill="#ff8888" opacity="0.5"/>

  <!-- Letter P -->
  <text x="60" y="82" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="62" fill="url(#textSilver)" text-anchor="middle" filter="url(#drop-shadow)" stroke="#999999" stroke-width="1">P</text>
</svg>
